syntax = "proto3";
package api.base.audit;
option go_package = "github.com/zhixingdx/oipivot-api/base/audit/v1;audit";
option java_multiple_files = true;
option java_package = "api.base.audit";

import "google/api/annotations.proto";
import "base/audit/v1/plus_message.proto";

service BaseAuditPortalPlus {
  // AppendRecords 仅内部RPC追加。
  rpc AppendRecords(AppendRecordsRequest) returns (AppendRecordsReply);
  // ConfirmSoftDelete 仅内部RPC确认已经提交的源库软删，不提供HTTP路由。
  rpc ConfirmSoftDelete(ConfirmSoftDeleteRequest) returns (AppendRecordsReply);
  // GetPayload 仅内部RPC按租户读取并留存访问证据。
  rpc GetPayload(GetPayloadRequest) returns (PayloadReply);
  // QueryRecords 只允许租户HTTP索引查询。
  rpc QueryRecords(PortalQueryRecordsRequest) returns (QueryRecordsReply) {
    option (google.api.http) = {
      post : "/api/base/audit/portal/plus/record/query"
      body : "*"
    };
  }
  // ReadPayload 只允许租户HTTP授权回读。
  rpc ReadPayload(PortalReadPayloadRequest) returns (PayloadReply) {
    option (google.api.http) = {
      post : "/api/base/audit/portal/plus/record/readPayload"
      body : "*"
    };
  }
}
