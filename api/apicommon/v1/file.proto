syntax = "proto3";
package api.apicommon;
// 特意使用 apicommon 居然与其他 common 包冲突
option go_package = "github.com/zhixingdx/public/api/apicommon/v1;apicommon";
option java_multiple_files = true;
option java_package = "api.apicommon";

// 文件附件
message FileAttachment {
  string name = 1;
  string url = 2;
  string type = 3;
  optional string size = 4;
  optional string desc = 5;
  optional string icon = 6;
  optional string cover = 7;
}